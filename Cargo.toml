[package]
name = "bevy_game"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.19"
avian2d = "0.7"
leafwing-input-manager = "0.21"
rand = "0.10"

[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only" # Drops clean build times by ~9% and rebuilds by ~21%
codegen-units = 256 # Split code into up to 256 parallel generation units
linker = "rust-lld.exe"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[env]
WGPU_BACKEND = "dx12"